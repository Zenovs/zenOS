# zenOS 1.0: unveränderliches Image aus Debian 13 «trixie» für arm64 (BCM2712).
#
# Gemeinsame Einstellungen für alle Profile. Die Profile ergänzen Kernel und Start:
#   argon   Argon ONE UP mit Compute Module 5 und Raspberry Pi 5, Kernel und Firmware von Raspberry Pi
#   qemu    virtuelle Maschine für die Angriffstests, Kernel von Debian, Start über UEFI
#
# Gebaut wird mit mkosi/bauen.sh in der Bauumgebung mkosi/umgebung/ (Docker-Kontext colima-zenos).
# Die Paketquellen stehen in mkosi.sandbox/ und zeigen auf einen festen Stand von snapshot.debian.org.
# Konzept und Gründe: docs/neubau.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64

[Build]
# Kein Zwischenspeicher des installierten Stands: Mit mkosi 25.3 scheitert sonst das Entfernen von dpkg im
# wiederverwendeten initrd (kmod verliert dabei dpkg-maintscript-helper). Die Pakete selbst bleiben im Paket-Cache.
Incremental=no
# Quellen für die Skripte, nebeneinander unter $SRCDIR (das Repo ist nur lesbar eingehängt, ineinander geht nicht):
# dieser Ordner (mkosi/), die Oberfläche (shell/), Schriften und Zeichen (assets/) und Quickshell 0.3.1 (geholt und
# geprüft von umgebung/bauen-innen.sh, nur in der Bauumgebung vorhanden).
BuildSources=.:mkosi
        ../shell:shell
        ../assets:assets
        /var/cache/zenos/quellen/quickshell-1a4716cde794a59928d9d9fc15f2afc7a95de360:quickshell

[Output]
Format=disk
ImageId=zenos
# Liste aller Pakete mit Version (json). «changelog» holte die Änderungslisten aus dem Netz und scheitert an
# Sicherheitsupdates, für die metadata.ftp-master.debian.org keine bereithält.
ManifestFormat=json
CompressOutput=no
RepartDirectories=repart/gemeinsam

[Content]
# Nur, was gebraucht wird: keine Doku, keine empfohlenen Zusatzpakete, keine Paketdatenbank im fertigen Image.
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
Locale=C.UTF-8
Hostname=zenos

# Jedes Paket hier hat einen Grund (docs/neubau.md, «Feste Liste der Systemdienste» und «Apps im Image»).
Packages=
        # Grundsystem: systemd mit Anmeldung, Namensauflösung, Konten (homed) und Verschlüsselung
        systemd
        systemd-sysv
        udev
        dbus-broker
        libpam-systemd
        libnss-systemd
        # /etc/pam.d/login: greetd nutzt diese PAM-Kette für die Anmeldung (in Debian 13 nicht mehr Grundausstattung)
        login
        systemd-resolved
        systemd-homed
        systemd-cryptsetup
        # Eigene Passwortabfrage beim Start und Notfall-Passwort (/usr/lib/zenos/entsperren, zen notfall): cryptsetup
        # öffnet die Daten, prüft Passwörter, legt den Notfall-Container an und löscht im Notfall alle Schlüssel
        cryptsetup-bin
        # Im Notfall geht das Notfall-Passwort nur über den Schlüsselbund des Kernels an den Dienst, der die Attrappe
        # anmeldet (keyctl), nie über eine Datei. request-key und der DNS-Helfer sind entfernt (RemoveFiles).
        keyutils
        # Hardware-Schlüssel (Bauauftrag 4): fido2-token, fido2-cred und fido2-assert (libfido2) für die Daten beim Start
        # (hmac-secret), pam_u2f für Anmeldung und Sperre, pamu2fcfg zum Eintragen der Schlüssel für die Anmeldung
        fido2-tools
        libpam-u2f
        pamu2fcfg
        systemd-repart
        # Updates (/usr/lib/zenos/update): curl lädt den neuen Stand, ssh-keygen prüft Zenos Signatur (FIDO2-Schlüssel,
        # /usr/lib/zenos/update-signierer), systemd-sysupdate schreibt die geprüfte Kopie in die freie Hälfte
        # (systemd-container). Von openssh-client bleibt nur ssh-keygen (RemoveFiles unten).
        systemd-container
        curl
        openssh-client
        # ext4 für die Datenpartition (systemd-repart formatiert sie beim ersten Start, fsck prüft sie)
        e2fsprogs
        polkitd
        apparmor
        # Tastaturbelegungen für die Konsole (Passwort beim Start), gewählt beim ersten Start
        kbd
        console-data
        # Netz: NetworkManager für WLAN, nftables als Firewall, chrony für die Zeit über NTS
        network-manager
        wpasupplicant
        nftables
        chrony
        ca-certificates
        # Oberfläche: Login, Fenstermanager, Browser, Terminal, Ton, Grafik
        greetd
        labwc
        # Automatische Sperre nach Inaktivität (swayidle, Leitplanke). Gesperrt wird mit der Oberfläche (Quickshell,
        # ext-session-lock und PAM); swaylock sperrt nur, wenn die Oberfläche nicht antwortet (Notfall-Sperre).
        swaylock
        swayidle
        chromium
        kitty
        fish
        pipewire
        pipewire-pulse
        wireplumber
        libgl1-mesa-dri
        fonts-dejavu-core
        # Laufzeit von Quickshell (mkosi.build.chroot baut es aus dem Quellcode): Qt unter Wayland, die
        # QML-Module der Oberfläche, SVG für Symbole, jemalloc gegen die Speicherzersplitterung der QML-Engine
        qt6-wayland
        libqt6svg6
        qt6-svg-plugins
        qml6-module-qtqml
        qml6-module-qtqml-models
        qml6-module-qtqml-workerscript
        qml6-module-qtquick
        qml6-module-qtquick-window
        qml6-module-qtquick-layouts
        qml6-module-qtquick-shapes
        qml6-module-qtquick-templates
        qml6-module-qt-labs-folderlistmodel
        libqt6widgets6
        libjemalloc2
        libpolkit-agent-1-0
        # Bildschirm aus nach der Sperre (wlr-output-power-management), für die Sitzung und den Login
        wlopm
        # Mauszeiger und Symbole (Adwaita, wie in zenOS 0.1)
        adwaita-icon-theme
        # Nicht dabei: xdg-desktop-portal. Es brächte GStreamer mit seinen Medien-Parsern mit und dient nur der
        # Bildschirmfreigabe in Videocalls; kommt bei Bedarf in einer späteren Stufe.

# Nur im Bau-Overlay für mkosi.build.chroot (Quickshell), nie im fertigen Image.
BuildPackages=
        build-essential
        cmake
        ninja-build
        pkg-config
        qt6-base-dev
        qt6-base-private-dev
        qt6-declarative-dev
        qt6-declarative-private-dev
        qt6-shadertools-dev
        qt6-wayland-dev
        qt6-wayland-private-dev
        qt6-svg-dev
        spirv-tools
        libcli11-dev
        libjemalloc-dev
        libdrm-dev
        libgbm-dev
        libegl-dev
        libvulkan-dev
        libwayland-dev
        wayland-protocols
        libpipewire-0.3-dev
        libpam0g-dev
        libpolkit-agent-1-dev
        libpolkit-gobject-1-dev
        libglib2.0-dev

# Härtung über die Befehlszeile des Kernels (Vorlage: Kicksecure, security-misc). Gilt für alle Profile; das Profil
# «argon» schreibt dieselbe Liste in cmdline.txt. Lockdown und erzwungene Modul-Signaturen kommen mit dem eigenen
# Kernel in 1.0, weil die Module von Raspberry Pi nicht signiert sind.
KernelCommandLine=
        init_on_alloc=1
        init_on_free=1
        slab_nomerge
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        debugfs=off
        iommu.strict=1
        iommu.passthrough=0
        # Kein Audit des Kernels: Es gibt keinen auditd, und die Einträge zu jedem Start und Ende eines Dienstes zeigten
        # im Journal etwa, wann zen notfall lief (BAUAUFTRAG.md, Bauauftrag 2: nichts davon im Journal). journald kann
        # das nicht abschalten, wenn es nicht selbst am Audit hängt.
        audit=0
        # Ruhige Konsole: Kernel-Meldungen (auch die der Protokollierung) stören sonst die Einrichtung beim ersten
        # Start und die Passwortabfrage.
        quiet

# Werkzeuge zur Paketverwaltung kommen nicht aufs Gerät (Leitplanke: nur, was im Image ist). Dazu der Schlüsselbund
# von systemd für Updates mit fremden Schlüsseln: zenOS vertraut nur Zenos FIDO2-Schlüsseln
# (/usr/lib/zenos/update-signierer). Von systemd-container braucht zenOS nur sysupdate und import; Container und
# Maschinen gibt es nicht. Von openssh-client nur ssh-keygen: kein SSH-Client, kein Agent (setgid), kein ssh-keysign
# (setuid root), keine Hilfsprogramme.
RemoveFiles=
        /usr/bin/ssh
        /usr/bin/scp
        /usr/bin/sftp
        /usr/bin/ssh-add
        /usr/bin/ssh-agent
        /usr/bin/ssh-argv0
        /usr/bin/ssh-copy-id
        /usr/bin/ssh-keyscan
        /usr/bin/slogin
        /usr/lib/openssh
        /usr/lib/systemd/user/ssh-agent.service
        /usr/lib/systemd/user/ssh-agent.socket
        /usr/lib/systemd/user/graphical-session-pre.target.wants/ssh-agent.service
        /usr/lib/tmpfiles.d/openssh-client.conf
        /etc/ssh
        # keyutils: Nur keyctl wird gebraucht. Ohne request-key lehnt der Kernel Schlüsselanfragen von aussen ab, statt
        # ein Hilfsprogramm als root zu starten.
        /usr/sbin/request-key
        /usr/sbin/key.dns_resolver
        /etc/request-key.conf
        /etc/request-key.d
        /usr/share/keyutils
        /usr/lib/systemd/import-pubring.gpg
        /usr/bin/systemd-nspawn
        /usr/bin/machinectl
        /usr/bin/importctl
        /usr/bin/systemd-vmspawn
        # sysupdate lädt nichts selbst (nur die geprüfte Kopie über systemd-import), also kein systemd-pull
        /usr/lib/systemd/systemd-pull
        /usr/bin/apt*
        /usr/bin/dpkg*
        /usr/lib/apt
        /usr/lib/systemd/system/apt-*
        /etc/apt
        /etc/cron.*
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/lintian
