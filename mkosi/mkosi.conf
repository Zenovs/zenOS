# zenOS 1.0: unveränderliches Image aus Debian 13 «trixie» für arm64 (BCM2712).
#
# Gemeinsame Einstellungen für alle Profile. Die Profile ergänzen Kernel und Start:
#   argon   Argon ONE UP mit Compute Module 5 und Raspberry Pi 5, Kernel und Firmware von Raspberry Pi
#   qemu    virtuelle Maschine für die Angriffstests, Kernel von Debian, Start über UEFI
#
# Gebaut wird mit mkosi/bauen.sh in der Bauumgebung mkosi/umgebung/ (Docker-Kontext colima-zenos).
# Die Paketquellen stehen in mkosi.sandbox/ und zeigen auf einen festen Stand von snapshot.debian.org.
# Konzept und Gründe: docs/neubau.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64

[Build]
# Kein Zwischenspeicher des installierten Stands: Mit mkosi 25.3 scheitert sonst das Entfernen von dpkg im
# wiederverwendeten initrd (kmod verliert dabei dpkg-maintscript-helper). Die Pakete selbst bleiben im Paket-Cache.
Incremental=no

[Output]
Format=disk
ImageId=zenos
# Liste aller Pakete mit Version (json). «changelog» holte die Änderungslisten aus dem Netz und scheitert an
# Sicherheitsupdates, für die metadata.ftp-master.debian.org keine bereithält.
ManifestFormat=json
CompressOutput=no
RepartDirectories=repart/gemeinsam

[Content]
# Nur, was gebraucht wird: keine Doku, keine empfohlenen Zusatzpakete, keine Paketdatenbank im fertigen Image.
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
Locale=C.UTF-8
Hostname=zenos

# Jedes Paket hier hat einen Grund (docs/neubau.md, «Feste Liste der Systemdienste» und «Apps im Image»).
Packages=
        # Grundsystem: systemd mit Anmeldung, Namensauflösung, Konten (homed) und Verschlüsselung
        systemd
        systemd-sysv
        udev
        dbus-broker
        libpam-systemd
        libnss-systemd
        # /etc/pam.d/login: greetd nutzt diese PAM-Kette für die Anmeldung (in Debian 13 nicht mehr Grundausstattung)
        login
        systemd-resolved
        systemd-homed
        systemd-cryptsetup
        systemd-repart
        # ext4 für die Datenpartition (systemd-repart formatiert sie beim ersten Start, fsck prüft sie)
        e2fsprogs
        polkitd
        apparmor
        # Tastaturbelegungen für die Konsole (Passwort beim Start), gewählt beim ersten Start
        kbd
        console-data
        # Netz: NetworkManager für WLAN, nftables als Firewall, chrony für die Zeit über NTS
        network-manager
        wpasupplicant
        nftables
        chrony
        ca-certificates
        # Oberfläche: Login, Fenstermanager, Browser, Terminal, Ton, Grafik
        greetd
        labwc
        # Sperre über ext-session-lock und PAM, automatisch nach Inaktivität (Leitplanke)
        swaylock
        swayidle
        chromium
        kitty
        fish
        pipewire
        pipewire-pulse
        wireplumber
        libgl1-mesa-dri
        fonts-dejavu-core
        # Nicht dabei: xdg-desktop-portal. Es brächte GStreamer mit seinen Medien-Parsern mit und dient nur der
        # Bildschirmfreigabe in Videocalls; kommt bei Bedarf in einer späteren Stufe.

# Härtung über die Befehlszeile des Kernels (Vorlage: Kicksecure, security-misc). Gilt für alle Profile; das Profil
# «argon» schreibt dieselbe Liste in cmdline.txt. Lockdown und erzwungene Modul-Signaturen kommen mit dem eigenen
# Kernel in 1.0, weil die Module von Raspberry Pi nicht signiert sind.
KernelCommandLine=
        init_on_alloc=1
        init_on_free=1
        slab_nomerge
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        debugfs=off
        iommu.strict=1
        iommu.passthrough=0
        # Ruhige Konsole: Kernel-Meldungen (auch die der Protokollierung) stören sonst die Einrichtung beim ersten
        # Start und die Passwortabfrage.
        quiet

# Werkzeuge zur Paketverwaltung kommen nicht aufs Gerät (Leitplanke: nur, was im Image ist).
RemoveFiles=
        /usr/bin/apt*
        /usr/bin/dpkg*
        /usr/lib/apt
        /usr/lib/systemd/system/apt-*
        /etc/apt
        /etc/cron.*
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/lintian
