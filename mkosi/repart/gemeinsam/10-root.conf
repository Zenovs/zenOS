# Das ganze System (/, mit /usr und /etc) als erofs, schreibgeschützt und mit dm-verity geprüft.
# /var bekommt beim ersten Start eine eigene, verschlüsselte Partition; die Inhalte aus den Paketen liegen dafür
# unter /usr/share/factory/var, im System bleiben nur die leeren Grundverzeichnisse (mkosi.finalize).
[Partition]
Type=root
Label=zenos_%A
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/boot/
ExcludeFilesTarget=/efi/
Verity=data
VerityMatchKey=root
Minimize=best
SplitName=root
