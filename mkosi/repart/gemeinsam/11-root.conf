# Das ganze System A (/, mit /usr und /etc) als erofs, schreibgeschützt und mit dm-verity geprüft. Im Image so klein wie
# möglich; beim ersten Start wächst die Partition auf 6 GB wie die B-Hälfte (/usr/lib/repart.d/11-root.conf), damit
# Updates abwechselnd in A und B passen. /var bekommt beim ersten Start eine eigene, verschlüsselte Partition; die
# Inhalte aus den Paketen liegen dafür unter /usr/share/factory/var (mkosi.finalize).
[Partition]
Type=root
Label=zenos_%A
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/boot/
ExcludeFilesTarget=/efi/
Verity=data
VerityMatchKey=root
Minimize=best
SplitName=root
