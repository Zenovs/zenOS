# Prüfsummen (Hash-Baum) zum System A. Der Wurzel-Hash steht in der Befehlszeile des Kernels; ab 1.0 ist sie signiert.
# Feste 128 MB wie die B-Hälfte, damit jeder spätere Stand hineinpasst. Sie steht vor dem System, damit das System die
# letzte Partition im Image ist und beim ersten Start auf 6 GB wachsen kann (/usr/lib/repart.d/11-root.conf).
[Partition]
Type=root-verity
Label=zenos_%A_verity
Verity=hash
VerityMatchKey=root
SizeMinBytes=128M
SizeMaxBytes=128M
SplitName=root-verity
