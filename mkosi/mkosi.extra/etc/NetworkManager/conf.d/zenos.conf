# NetworkManager in zenOS 1.0.
[main]
dns=systemd-resolved

# Keine Verbindungsprüfung: Sie fragte von selbst einen Server im Netz an (Regel 8).
[connectivity]
enabled=false

# Zufällige MAC-Adresse bei der Suche und eine eigene, feste je WLAN: Andere Netze sehen nicht dieselbe Adresse.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable-ssid
ethernet.cloned-mac-address=stable

# Gespeicherte Netze liegen unter /var (verschlüsselt), weil /etc schreibgeschützt ist.
[keyfile]
path=/var/lib/NetworkManager/system-connections
