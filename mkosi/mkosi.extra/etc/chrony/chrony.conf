# Zeit für zenOS 1.0 nur über NTS (Network Time Security): Jede Antwort ist authentisch.
# Ohne Echtheitsprüfung könnte jemand im Netz die Uhr zurückdrehen und alte Stände oder Zertifikate frisch aussehen
# lassen. Drei unabhängige Betreiber, damit keiner allein die Zeit bestimmt.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
minsources 2

# Das CM5 hat ohne Batterie keine laufende Uhr. Beim ersten Abgleich nach dem Start darf das Zertifikat des
# NTS-Servers deshalb ausserhalb seiner Gültigkeit scheinen; die Signatur wird trotzdem geprüft.
nocerttimecheck 1

ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync

# Keine Befehle über das Netz, nur lokal über den Socket.
cmdport 0
