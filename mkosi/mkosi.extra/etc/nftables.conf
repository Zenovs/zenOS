#!/usr/sbin/nft -f
# Firewall von zenOS 1.0: Kein Dienst nimmt Verbindungen von aussen an (Leitplanke).
# Erlaubt sind nur Antworten auf eigene Verbindungen, DHCP und die nötigen ICMPv6-Meldungen. Es gibt keinen
# Schalter, der das ändert; die Datei liegt im schreibgeschützten System.

flush ruleset

table inet zenos {
	chain eingang {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept

		# IPv6 braucht Nachbarsuche und Router-Meldungen, sonst gibt es keine Adresse.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept

		# Antworten von DHCP-Servern (v4 und v6) für die eigene Adresse.
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
	}

	chain weiterleitung {
		type filter hook forward priority filter; policy drop;
	}

	chain ausgang {
		type filter hook output priority filter; policy accept;
	}
}
