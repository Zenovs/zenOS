# Login von zenOS 1.0. Vorschau 1 nimmt den Text-Login von greetd; der Login im Look von zenOS kommt mit Quickshell.
[terminal]
vt = 1

[default_session]
# Debian legt agreety nach /usr/sbin, das nicht im Suchpfad des Benutzers _greetd liegt.
command = "/usr/sbin/agreety --cmd labwc"
user = "_greetd"
