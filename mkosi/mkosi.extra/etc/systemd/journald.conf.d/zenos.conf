# Protokolle nur im Arbeitsspeicher (Vorschau 1). Die machine-id ist bei jedem Start neu; dauerhafte Protokolle
# legten sonst je Start ein eigenes Verzeichnis an. Kommt zurück, sobald die machine-id gespeichert wird.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
# Kein Audit (BAUAUFTRAG.md, Bauauftrag 2: nichts von zen notfall im Journal). Abgeschaltet ist es auf der
# Befehlszeile des Kernels (audit=0, mkosi.conf); das hier sorgt dafür, dass journald es nie einschaltet.
Audit=no
