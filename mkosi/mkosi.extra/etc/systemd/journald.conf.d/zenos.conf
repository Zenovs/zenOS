# Protokolle nur im Arbeitsspeicher (Vorschau 1). Die machine-id ist bei jedem Start neu; dauerhafte Protokolle
# legten sonst je Start ein eigenes Verzeichnis an. Kommt zurück, sobald die machine-id gespeichert wird.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
# Kein Audit des Kernels: Es gibt keinen auditd, und die Einträge zu jedem Start und Ende eines Dienstes zeigten etwa,
# wann zen notfall lief (BAUAUFTRAG.md, Bauauftrag 2: nichts davon im Journal). Meldungen von AppArmor bleiben.
Audit=no
