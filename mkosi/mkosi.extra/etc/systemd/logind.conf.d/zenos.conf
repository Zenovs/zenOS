# Keine Text-Konsolen zum Anmelden ausser dem Login von greetd: weniger Wege ins System.
# Ein/Aus-Taste: Ein kurzer Druck sperrt nur (Leitplanke: ein versehentlicher Druck schaltet nicht aus), gedrückt halten
# schaltet aus. Am Login gibt es nichts zu sperren; dort bewirkt ein kurzer Druck nichts.
# Deckel (Argon ONE UP, Overlay zenos-deckel): Zuklappen sperrt immer, auch am Netzteil und mit einem zweiten
# Bildschirm (Leitplanke: zu heisst gesperrt). logind schickt «Lock» an die Sitzung, swayidle ruft /usr/lib/zenos/sperren.
# Kein Programm kann das mit einer Sperre (Inhibitor) verhindern, und es gibt keine Schonfrist nach dem Start: Die
# 30 Sekunden von logind sind für Docks beim Standby gedacht, und Standby gibt es auf dem CM5 nicht.
[Login]
NAutoVTs=0
ReserveVT=0
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=lock
LidSwitchIgnoreInhibited=yes
HoldoffTimeoutSec=0
