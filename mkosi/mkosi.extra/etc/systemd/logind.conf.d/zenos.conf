# Keine Text-Konsolen zum Anmelden ausser dem Login von greetd: weniger Wege ins System.
# Ein/Aus-Taste: Ein kurzer Druck sperrt nur (Leitplanke: ein versehentlicher Druck schaltet nicht aus), gedrückt halten
# schaltet aus. Am Login gibt es nichts zu sperren; dort bewirkt ein kurzer Druck nichts.
[Login]
NAutoVTs=0
ReserveVT=0
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
