# Leere B-Hälfte für Updates (Vorschau 2), beim ersten Start angelegt: systemd-sysupdate schreibt den nächsten
# Stand hierhin. Sie steht nicht im Image, damit es klein bleibt (sonst 6 GB Nullen beim Schreiben auf den Stick).
# «_empty» ist die Bezeichnung, an der sysupdate eine freie Partition erkennt.
[Partition]
Type=root
Label=_empty
SizeMinBytes=6G
SizeMaxBytes=6G
