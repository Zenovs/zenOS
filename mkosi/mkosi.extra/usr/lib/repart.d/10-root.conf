# Beschreibung der Partitionen für systemd-repart im laufenden System (erster Start, später sysupdate).
# systemd-repart ordnet vorhandene Partitionen den Beschreibungen gleichen Typs der Reihe nach zu. Diese erste
# Beschreibung gehört deshalb zur vorhandenen A-Hälfte des Systems. Sie hat absichtlich keine Grösse und keinen
# Inhalt: systemd-repart lässt die A-Hälfte so, wie sie ist. Gebaut wird sie aus mkosi/repart/gemeinsam/.
[Partition]
Type=root
