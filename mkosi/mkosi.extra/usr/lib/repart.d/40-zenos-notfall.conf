# Notfall-Partition (BAUAUFTRAG.md, Bauauftrag 2), beim ersten Start vor den Daten angelegt. Ohne Dateisystem: Entweder
# Nullen (kein Notfall-Passwort; /usr/lib/zenos/daten-anlegen nullt sie gleich nach dem Anlegen) oder ein
# LUKS2-Container mit nur dem Notfall-Passwort, darin nur der Kontoname.
[Partition]
Type=linux-generic
Label=zenos-notfall
SizeMinBytes=32M
SizeMaxBytes=32M
