# Verschlüsselte Datenpartition für /var und /home. systemd-repart legt sie beim ersten Start auf dem restlichen
# Platz des Datenträgers an, mit LUKS2 und einem Einmal-Schlüssel aus /run (/usr/lib/zenos/daten-anlegen).
# Danach ersetzt /usr/lib/zenos/daten-schuetzen ihn durch Zenos Passwort und einen Wiederherstellungsschlüssel.
[Partition]
Type=linux-generic
Label=zenos-daten
Format=ext4
Encrypt=key-file
# /home ist ein Verzeichnis auf dieser Partition (/var/home, per fstab nach /home gebunden).
MakeDirectories=/home
