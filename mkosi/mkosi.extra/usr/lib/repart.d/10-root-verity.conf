# Beschreibung der Partitionen für systemd-repart im laufenden System (erster Start). systemd-repart ordnet vorhandene
# Partitionen den Beschreibungen gleichen Typs der Reihe nach zu. Diese erste Beschreibung gehört zu den Prüfsummen der
# vorhandenen A-Hälfte; ohne Grösse und Inhalt lässt systemd-repart sie, wie sie ist (fest 128 MB aus dem Image).
[Partition]
Type=root-verity
