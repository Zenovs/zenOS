# Verzeichnisse auf der verschlüsselten /var-Partition, die kein Paket selbst anlegt. Caches leert der Bau
# (mkosi.finalize); was ein Dienst dort erwartet, entsteht hier beim Start.
d /var/cache/apparmor 0755 root root -
# Laufzeitordner von zenOS: für alle lesbar (die Oberfläche beobachtet ihn, auch der Login als _greetd)
d /run/zenos 0755 root root -
# Hardware-Schlüssel für die Anmeldung (pam_u2f) und ihre Zuordnung zu den Plätzen der Daten; nur root schreibt. Die
# Sperre liest die Liste als Konto, also müssen beide Ordner für alle durchsuchbar sein («d» setzt den Modus auch bei
# einem bestehenden Ordner, bei jedem Start).
d /var/lib/zenos 0755 root root -
d /var/lib/zenos/schluessel 0755 root root -
