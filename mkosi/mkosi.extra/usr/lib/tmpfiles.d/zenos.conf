# Verzeichnisse auf der verschlüsselten /var-Partition, die kein Paket selbst anlegt. Caches leert der Bau
# (mkosi.finalize); was ein Dienst dort erwartet, entsteht hier beim Start.
d /var/cache/apparmor 0755 root root -
# Laufzeitordner von zenOS: für alle lesbar (die Oberfläche beobachtet ihn, auch der Login als _greetd)
d /run/zenos 0755 root root -
