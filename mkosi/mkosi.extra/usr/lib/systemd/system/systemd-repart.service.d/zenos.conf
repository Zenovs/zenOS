# systemd-repart legt beim ersten Start die verschlüsselte Datenpartition an (/usr/lib/repart.d/50-zenos-daten.conf).
# Dafür braucht es einen Schlüssel; den erzeugt /usr/lib/zenos/daten-anlegen nur im Arbeitsspeicher.
#
# repart sperrt die ganze Platte, solange es arbeitet. udev stellt Ereignisse gesperrter Platten zurück und verwirft sie
# nach drei Minuten ganz; dann entstehen die Verweise /dev/disk/by-partlabel/… bis zum nächsten Start nie. Am Argon
# (NVMe, 500 GB) am 13.11.2026 genau so: repart lief, während udev die Partitionen noch erfasste. Deshalb erst nach dem
# Erfassen aller Geräte (udev-trigger, dann «udevadm settle» in daten-anlegen). Die Meldungen gehen auch auf die
# Konsole: Beim ersten Start sieht Zeno, dass der Speicher vorbereitet wird.
[Unit]
After=systemd-udev-trigger.service

[Service]
ExecStart=
ExecStart=/usr/lib/zenos/daten-anlegen
TimeoutStartSec=infinity
StandardOutput=journal+console
StandardError=journal+console
