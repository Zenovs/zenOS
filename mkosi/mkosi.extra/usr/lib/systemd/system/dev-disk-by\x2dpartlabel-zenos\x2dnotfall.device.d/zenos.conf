# zenOS: Beim ersten Start entsteht diese Partition erst durch systemd-repart (/usr/lib/zenos/daten-anlegen), und das
# dauert auf einer grossen SSD länger als die üblichen 90 Sekunden, die systemd auf ein Gerät wartet. Nach Ablauf landete
# der Start im Notfallmodus, den ohne root niemand öffnen kann. Die Notfall-Partition braucht zenos-entsperren nur mit
# Wants=: Fehlt sie wirklich (etwa auf einem Gerät von vor dem 12.11.2026), soll der Start nicht ewig warten, sondern
# nach 30 Minuten ohne sie weitergehen. Beim ersten Start reicht das für repart auch auf einer langsamen SSD.
[Unit]
JobRunningTimeoutSec=30min
