# zenOS: greetd gibt nie auf. Debian lässt greetd nach fünf schnellen Neustarts stehen; dann bliebe der Bildschirm
# schwarz. Der Login hat einen Notausgang (/usr/lib/zenos/greeter), deshalb immer wieder versuchen, mit Pause.
# Gestartet über /usr/lib/zenos/greetd-starten: Nur nach dem Notfall-Passwort nimmt es die Konfiguration der Attrappe
# aus /run, sonst /etc/greetd/config.toml wie bisher.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=2
ExecStart=
ExecStart=/usr/lib/zenos/greetd-starten
