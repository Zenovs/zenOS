# Profil «argon»: Argon ONE UP mit Compute Module 5 (Zenos Laptop) und Raspberry Pi 5, beide mit dem BCM2712.
#
# Kernel, Gerätebäume und WLAN-Firmware kommen von Raspberry Pi (archive.raspberrypi.com, nur diese Pakete, siehe
# mkosi.sandbox/etc/apt/preferences.d), alles andere von Debian. Der Bootloader des CM5 kennt kein UEFI: mkosi baut
# Kernel und initrd, mkosi/mkosi.postoutput legt sie mit Gerätebäumen, config.txt und cmdline.txt (mit dem
# Verity-Wurzel-Hash) auf die Bootpartition. Ab 1.0 steckt das alles im signierten boot.img.

[Output]
SplitArtifacts=kernel,initrd

[Content]
Bootable=yes
Bootloader=none
Packages=
        # Kernel 6.18 für den BCM2712, gepinnt auf den Stand von Raspberry Pi am 08.11.2026
        linux-image-rpi-2712=1:6.18.60-1+rpt1
        # WLAN des CM5 (Infineon CYW43455) und die erlaubten Funkkanäle je Land (sonst oft kein 5 GHz)
        firmware-brcm80211
        wireless-regdb
# loglevel=3: Kernel-Meldungen der Stufe «Fehler» (etwa vom WLAN-Chip oder der USB-Kamera) erscheinen sonst auf tty1
# mitten in den Fragen des ersten Starts und neben dem Wiederherstellungsschlüssel. Sie bleiben im Journal.
KernelCommandLine=
        console=tty1
        loglevel=3

# Was das initrd auf dem Argon ONE UP braucht, um nach dem Passwort zu fragen und das System zu prüfen:
# NVMe und USB (RP1, dwc2 für Tastatur und Touchpad), HID, Grafik (vc4), dm-verity, dm-crypt, erofs und ext4.
#
# Achtung, mkosi 25.3: Die Include-Liste wirkt nur zusammen mit einer Exclude-Liste; ohne sie kommen alle Module und
# ihre Firmware ins initrd (kmod.py: «if not exclude: return»). Am 14.11.2026 waren es 1916 Module, auch 157 für WLAN.
# brcmfmac lud deshalb schon im initrd, fand dort seine Firmware nicht (der Verweis über /etc/alternatives fehlt im
# initrd) und gab den Chip auf; im System lädt es danach nie neu, also kein WLAN. Ausgeschlossen werden deshalb nur
# Funk-Treiber; alles andere bleibt wie in dem initrd, mit dem der Argon bis ins System startet. WLAN und Bluetooth
# lädt udev nach dem Wechsel ins System, mit der vollständigen Firmware.
KernelModulesInitrdExclude=
        drivers/net/wireless/
        drivers/bluetooth/
        net/bluetooth/
KernelModulesInitrdInclude=
        default
        drivers/nvme/
        drivers/pci/controller/
        drivers/mfd/
        drivers/usb/dwc2/
        drivers/usb/dwc3/
        drivers/usb/host/
        drivers/hid/
        drivers/gpu/drm/vc4/
        drivers/md/dm-verity
        drivers/md/dm-crypt
        fs/erofs/
        fs/ext4/
