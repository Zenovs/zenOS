# Bootpartition für den Bootloader des CM5 und des Pi 5: FAT, Typ «EFI System» auf GPT (unterstützt seit den
# Bootloader-Ständen für Pi 4 und Pi 5). Sie ist hier leer; mkosi/mkosi.postoutput schreibt Kernel, initrd,
# Gerätebäume, config.txt und cmdline.txt hinein. Sie muss die erste Partition sein.
[Partition]
Type=esp
Label=zenos-start
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
