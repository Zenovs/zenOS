# Partition 1: Auswahl des Starts. Der Bootloader des CM5 und des Pi 5 liest hier autoboot.txt und startet danach
# Startpartition A (2) oder B (3), mit «tryboot» einmal zur Probe die andere (A/B-Schema von Raspberry Pi). Hier liegt
# auch die beim ersten Start gewählte Tastaturbelegung (zenos/tastatur). Updates ersetzen diese Partition nie; geändert
# wird nur autoboot.txt, wenn ein neuer Stand fest wird (/usr/lib/zenos/update).
# Die drei FAT-Partitionen müssen auf GPT die ersten sein (der Bootloader zählt FAT-Partitionen) und gross genug für
# FAT32 (unter etwa 33 MB wäre es kein gültiges FAT32 mehr). systemd-repart formatiert sie mit 4096 Byte pro Sektor, das
# liest der Bootloader nicht: mkosi.postoutput formatiert alle drei mit 512 Byte pro Sektor neu.
[Partition]
Type=esp
Label=zenos-start
Format=vfat
SizeMinBytes=64M
SizeMaxBytes=64M
