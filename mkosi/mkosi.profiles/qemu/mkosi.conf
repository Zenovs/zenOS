# Profil «qemu»: virtuelle Maschine für die Angriffstests.
# Dasselbe System wie auf dem Gerät, aber mit dem Kernel von Debian (er kennt die virtuellen Geräte von QEMU)
# und Start über UEFI mit systemd-boot. mkosi schreibt den Verity-Wurzel-Hash selbst in die Befehlszeile des UKI.

[Content]
Bootable=yes
Bootloader=systemd-boot
Packages=
        linux-image-arm64
        systemd-boot
        # systemd-stub für das UKI: Kernel, initrd und Befehlszeile in einer Datei. Ohne ihn baute mkosi einen
        # einfachen Starteintrag, dessen Befehlszeile sich beim Start bearbeiten liesse.
        systemd-boot-efi
# Serielle Konsole für die Tests; Fehler aus dem Journal erscheinen dort, weil der Testbenutzer das Journal nicht
# lesen darf. Nur im Profil qemu, nie auf dem Gerät.
KernelCommandLine=
        console=ttyAMA0
        systemd.journald.forward_to_console=1
        systemd.journald.max_level_console=err
