# zenOS: Installation für x86-Rechner (amd64), auf dem Installer-Stick unter /autoinstall.yaml.
# Quelle im Repo: image/x86/autoinstall.yaml, auf den Stick gelegt von image/x86-stick.sh. Doku: docs/image-und-releases.md,
# Abschnitt «Bürorechner (x86)», Format: https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
#
# Der Stick ist das ISO von Ubuntu Desktop mit seinem grafischen Installer. Er zeigt alle gewohnten Schritte
# (interactive-sections «*»): Sprache, Tastatur, Netz, Umfang der Installation, Festplatte mit Verschlüsselung, Zeitzone,
# Name, Rechnername, Benutzer und Passwort. Kein Passwort steht in dieser Datei. Diese Datei fügt nur hinzu, was der
# Installer nicht fragt: git für /opt/zenos und am Ende die Einrichtung von zenOS (image/x86/einrichten.sh, wie der Bau
# des Pi-Images mit «install.sh --image»). Danach startet der Rechner in den Login von zenOS.
#
# YAML: nur mit Leerzeichen einrücken, nie mit Tabulatoren.

autoinstall:
  version: 1

  # Alle Schritte grafisch, wie bei Ubuntu Desktop
  interactive-sections:
    - "*"

  # git braucht einrichten.sh für /opt/zenos (fehlt es trotzdem, installiert einrichten.sh es nach)
  packages:
    - git

  # zenOS einrichten (ohne Shell: Argumentliste). Scheitert es, meldet der Installer einen Fehler; Ubuntu ist dann
  # installiert, zenOS lässt sich nach dem Neustart von Hand einrichten (ANLEITUNG.md, Abschnitt H).
  late-commands:
    - [bash, /cdrom/zenos/einrichten.sh, /target]
