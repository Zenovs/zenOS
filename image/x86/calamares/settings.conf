# zenOS: Ablauf des Installers (Calamares) auf dem Installations-ISO für x86-Rechner.
# Liegt in der Live-Schicht unter /etc/calamares/settings.conf (image/x86/bauen.sh). Doku: docs/image-und-releases.md,
# Abschnitt «Bürorechner (x86)». Vorbild: die Einstellungen von Lubuntu 26.04 (calamares-settings-ubuntu), ohne
# Paketauswahl, ohne Spiegelwahl nach Standort und ohne Downloads: Der Installer kopiert nur zenOS auf die Platte und
# braucht kein Netz.
---
modules-search: [ local ]

instances:
  # Nach dem Bootloader: Starteintrag «zenOS», Rückfallpfad EFI/BOOT, SSH-Schlüssel des Rechners
  - id: zenos-abschluss
    module: shellprocess
    config: shellprocess_zenos_abschluss.conf
  # Protokoll des Installers ins installierte System (/var/log/zenos/installer-calamares.log)
  - id: zenos-protokoll
    module: shellprocess
    config: shellprocess_zenos_protokoll.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - hwclock
      - dracut
      - grubcfg
      - bootloader
      - shellprocess@zenos-abschluss
      - shellprocess@zenos-protokoll
      - umount
  - show:
      - finished

branding: zenos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
# Während des Kopierens nicht abbrechen: Eine halb beschriebene Platte startet nicht
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
