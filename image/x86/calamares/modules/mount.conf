# zenOS: Einhängepunkte im Zielsystem während der Installation (wie Lubuntu 26.04, ohne Namensauflösung und ohne
# /cdrom: Im Zielsystem wird nichts geladen).
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: ext4
    ssdOptions: [ discard ]
  - filesystem: swap
    ssdOptions: [ discard ]
