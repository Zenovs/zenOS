# zenOS: Benutzer und Rechnername. zenOS hat genau einen Benutzer (Grundsatz 0): Er bekommt sudo (nur mit Passwort),
# root bleibt ohne Passwort gesperrt, keine automatische Anmeldung (die Sperre gilt immer).
---
defaultGroups:
  - adm
  - cdrom
  - dip
  - plugdev
  - sudo
  - name: users
    must_exist: true
    system: true
sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: -1
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
    - usersubstr=4
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - nobody
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - uucp
    - proxy
    - www-data
    - backup
    - list
    - irc
    - apt
    - messagebus
    - syslog
    - systemd-network
    - systemd-resolve
    - systemd-timesync
    - polkitd
    - greeter
    - _greetd
    - zenos-anzeige
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "zenos-${cpu}"
  forbidden_names:
    - localhost

allowActiveDirectory: false
