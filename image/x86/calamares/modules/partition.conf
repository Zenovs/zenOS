# zenOS: Partitionen. Wie Lubuntu 26.04: GPT mit EFI-Partition, bei Verschlüsselung eine unverschlüsselte /boot-
# Partition (Kernel und initramfs) und die Wurzel in LUKS2. Die Passphrase fragt das initramfs beim Start ab
# (dracut, rd.luks.uuid von grubcfg), GRUB muss nichts entschlüsseln. Verschlüsselung ist vorgewählt
# (Grundsatz 1: Sicherheit ist Standard), lässt sich aber abwählen.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: "EFI"

# Nur UEFI: Das ISO startet nur mit UEFI, die Platte bekommt GPT
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt

enableLuksAutomatedPartitioning: true
preCheckEncryption: true
luksGeneration: luks2
showNotEncryptedBootMessage: false

# Swap als Datei in der (verschlüsselten) Wurzel
userSwapChoices:
  - none
  - file
initialSwapChoice: file

# Löschen ist nicht vorgewählt: Man wählt bewusst, was mit der Platte geschieht
initialPartitioningChoice: none
allowManualPartitioning: true
drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

lvm:
  enable: false

partitionLayout:
  - name: "zenos_boot"
    filesystem: ext4
    noEncrypt: true
    onlyPresentWithEncryption: true
    mountPoint: "/boot"
    size: 2G
  - name: "zenos"
    filesystem: unknown
    mountPoint: "/"
    size: 100%
