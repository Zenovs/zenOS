# zenOS: Tastaturbelegung. /etc/default/keyboard im installierten System lesen die Sitzung, der Login und das
# initramfs (Passphrase der Platte). In der Live-Sitzung setzt Calamares die Belegung über locale1; die
# Installer-Sitzung übernimmt sie von dort in labwc (zenos-iso-tastatur), damit Passwörter mit der
# gewählten Belegung getippt werden.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
useLocale1: true
guessLayout: true
configure:
  kwin: false
