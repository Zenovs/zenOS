# zenOS: Bootloader. GRUB mit shim (signiert von Microsoft und Canonical) für Secure Boot, wie Lubuntu 26.04. Der
# signierte GRUB hat /EFI/ubuntu fest eingebaut, deshalb heisst der Ordner so. Den Starteintrag in der Firmware nennt
# danach shellprocess@zenos-abschluss «zenOS», ebenso legt er den Rückfallpfad EFI/BOOT an (installEFIFallback
# kopierte nur GRUB ohne shim, das startet mit Secure Boot nicht).
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 0"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
installEFIFallback: false
