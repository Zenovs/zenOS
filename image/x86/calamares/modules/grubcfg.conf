# zenOS: /etc/default/grub im Zielsystem. GRUB_DISTRIBUTOR bleibt, wie zenOS ihn setzt
# (/etc/default/grub.d/zenos-distributor.cfg, docs/module/kennung.md): Menütitel «zenOS», Ordner und Starteintrag
# von grub-install bei EFI/ubuntu (der signierte GRUB sucht dort). «splash» ergänzt grubcfg selbst, weil Plymouth
# installiert ist, «rd.luks.uuid=…» bei Verschlüsselung.
---
overwrite: false
prefer_grub_d: false
keep_distributor: true
kernel_params: [ "quiet" ]
defaults:
  GRUB_TIMEOUT: 0
  GRUB_TIMEOUT_STYLE: hidden
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
