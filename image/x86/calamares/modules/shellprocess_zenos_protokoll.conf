# zenOS: Protokoll des Installers ins installierte System (/var/log/zenos/installer-calamares.log, nur für root
# lesbar). Ein Fehler hier hält die Installation nicht auf. Danach weiss die Installer-Sitzung, dass die Installation
# durch ist (/run/zenos-iso/fertig).
---
dontChroot: true
timeout: 30
script:
  - "-/usr/local/libexec/zenos-iso/protokoll ${ROOT}"
