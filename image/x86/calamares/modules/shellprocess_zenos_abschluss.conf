# zenOS: Abschluss nach dem Bootloader (image/x86/live/abschluss): Starteintrag der Firmware «zenOS» statt «ubuntu»,
# Rückfallpfad EFI/BOOT mit shim, grub2/update_nvram aus, SSH-Schlüssel des Rechners. Läuft im Live-System mit dem
# Zielsystem als Argument (als Argumentliste, ohne Eingaben aus dem Installer).
---
dontChroot: true
timeout: 120
script:
  - "/usr/local/libexec/zenos-iso/abschluss ${ROOT}"
