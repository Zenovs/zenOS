# zenOS: Begrüssung und Voraussetzungen. Keine Links (Support, Spenden, Versionshinweise) und keine Prüfung der
# Internetverbindung: Der Installer geht nicht ins Netz (Regel 8, keine automatischen Verbindungen).
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 20
  requiredRam: 2.0
  check:
    - storage
    - ram
    - power
    - root
  required:
    - storage
    - ram
    - root

# Keine Standortabfrage über das Netz
geoip:
  style: "none"
