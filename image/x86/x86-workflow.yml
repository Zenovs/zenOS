# VORÜBERGEHEND HIER: gehört nach .github/workflows/x86.yml. Der GitHub-Zugang auf dem Pi hat das Recht «workflow»
# nicht (Push abgelehnt, 18.10.2026). Verschieben mit «git mv image/x86/x86-workflow.yml .github/workflows/x86.yml»,
# sobald gepusht werden darf (gh auth refresh -h github.com -s workflow). docs/baufortschritt.md, «Stand».
# Installations-ISO für x86-Rechner (amd64): Testbau und Start in QEMU.
# Baut bei jedem Push auf dev, der image/x86/, test/x86/ oder diese Datei ändert (und von Hand), ein unsigniertes
# Test-ISO (image/x86/bauen.sh --testbau-ohne-signatur) im Container ubuntu:26.04, startet es in QEMU mit KVM, UEFI
# und Secure Boot (Schlüssel von Microsoft) und hält Bildschirmfotos fest (test/x86/qemu-test.py). Das ISO bleibt drei
# Tage als Artefakt; ein Release wird nie daraus (Releases nur aus gültig signierten Tags). Das ist die Ausnahme von
# «Testbau nie in GitHub Actions» beim Pi-Image: Ein amd64-ISO lässt sich auf dem Pi nicht bauen (Entscheid Zeno,
# 18.10.2026). Doku: docs/image-und-releases.md, Abschnitt «Bürorechner (x86)».
# Einzige fremde Actions sind checkout und upload-artifact, auf einen Commit festgelegt. Keine Geheimnisse, nur
# Leserechte.
name: x86

on:
  push:
    branches: [dev]
    paths:
      - "image/x86/**"
      - "test/x86/**"
      - ".github/workflows/x86.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbau:
    name: Test-ISO bauen und starten
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Platz auf dem Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/zenos
          df -h / /mnt

      - name: ISO bauen (Container ubuntu:26.04)
        env:
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sudo docker run --rm --privileged -e GITHUB_ACTIONS \
            -v "$GITHUB_WORKSPACE:/quelle:ro" -v /mnt/zenos:/mnt/zenos \
            ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78 \
            /quelle/image/x86/container-bauen.sh --testbau-ohne-signatur --quelle /quelle --origin "$ORIGIN" \
            --arbeit /mnt/zenos/arbeit --ausgabe /mnt/zenos/ausgabe
          sudo chown -R "$(id -u):$(id -g)" /mnt/zenos/ausgabe
          ls -la /mnt/zenos/ausgabe

      - name: Start in QEMU (UEFI, Secure Boot, USB-Stick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          iso=$(find /mnt/zenos/ausgabe -maxdepth 1 -name 'zenos-*-x86-amd64.iso' -print -quit)
          python3 test/x86/qemu-test.py "$iso" "$RUNNER_TEMP/qemu"

      - name: Protokolle sammeln
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/protokolle"
          sudo cp /mnt/zenos/arbeit/install.log "$RUNNER_TEMP/protokolle/" 2>/dev/null || true
          sudo cp /mnt/zenos/arbeit/basis.txt "$RUNNER_TEMP/protokolle/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/protokolle"

      - name: Bildschirmfotos und Protokolle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x86-testbau-bilder
          path: |
            ${{ runner.temp }}/qemu
            ${{ runner.temp }}/protokolle
          if-no-files-found: ignore
          retention-days: 3

      - name: Test-ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x86-testbau-iso
          path: /mnt/zenos/ausgabe
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
