# zenOS: Standardbenutzer für den ersten Start ohne Einstellungen aus dem Raspberry Pi Imager.
# Quelle im Repo: image/erststart/90-zenos-benutzer.cfg, ins Image gelegt von image/bauen.sh.
#
# cloud-init legt den Standardbenutzer nur an, wenn die user-data keine eigene «users»-Liste hat (so die user-data
# von zenOS; der Imager bringt seine eigene Liste mit, dann gilt diese Datei nicht). Gruppen, Shell und
# lock_passwd kommen aus /etc/cloud/cloud.cfg, das Passwort setzt chpasswd in der user-data.
# «sudo: null» statt NOPASSWD:ALL aus cloud.cfg: sudo geht über die Gruppe sudo, aber immer mit Passwort. Sonst
# wären Passwortabfragen wie beim Ausschalten der Firewall wirkungslos.
system_info:
  default_user:
    name: user
    gecos: Default User
    sudo: null
