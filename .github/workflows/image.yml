# Image-Bau für den Raspberry Pi 5, nur bei Tags v*.
# Zuerst prüft der Job «Tag und Signatur» (image/tag-pruefen.sh), ob der Tag ein Release-Tag vX.Y.Z oder vX.Y.Z-rcN ist
# und mit dem Release-Schlüssel des Ankers system/vertrauen in seinem Stand gültig signiert (git verify-tag gehärtet und
# ssh-keygen -Y verify, auf genau den Commit des Laufs). Sonst baut nichts. bauen.sh prüft dasselbe noch einmal und im
# chroot zenos-kanal ein drittes Mal, wie ein Gerät.
# Kanal je nach Tag: vX.Y.Z → stabil, vX.Y.Z-rcN → vorschau. Das Image bekommt den Anker aus system/vertrauen und den
# Zustand ab Werk (gut.json, hoechste, gesehen.json aus dem Tag).
# Tags mit «-rc» (z. B. v0.1.0-rc4): Image und Quellcode bauen und als Workflow-Artefakte ablegen, kein Release.
# vX.Y.Z: dazu ein GitHub-Release mit Image, Paketliste, SHA256SUMS, Manifest für den Raspberry Pi Imager und dem
# Quellcode aller enthaltenen Pakete (image/quellen.sh). Ohne vollständige Quellen kein Release (GPL), und ohne grüne
# Prüfung (Job «Prüfung», scripts/pruefen.sh über pruefen.yml für genau diesen Stand) auch nicht.
# Image, Paketliste und Manifest (alle in SHA256SUMS) bekommen eine Herkunftsbestätigung von GitHub (Artifact
# Attestation, Sigstore).
# Ablauf und Grenzen: image/README.md und docs/image-und-releases.md.
name: Image

on:
  push:
    tags:
      - "v*"

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag und Signatur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pruefen.outputs.version }}
      kanal: ${{ steps.pruefen.outputs.kanal }}
      release: ${{ steps.pruefen.outputs.release }}
      schluessel: ${{ steps.pruefen.outputs.schluessel }}
      serie: ${{ steps.pruefen.outputs.serie }}
    steps:
      # Ganze Geschichte: Mit fetch-depth 0 kommen alle Tags als Tag-Objekte (+refs/tags/*:refs/tags/*), auch
      # vertrauen/NNNN samt Commit (geprüft im Quelltext von v7.0.1, src/ref-helper.ts: testRef vergleicht mit ^{commit},
      # der Tag bleibt annotiert). tag-pruefen.sh lehnt einen leichten Tag ab, gebaut wird dann nichts.
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Signatur prüfen (verify-tag gegen system/vertrauen)
        id: pruefen
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image/tag-pruefen.sh --commit "$COMMIT" "$TAG" > "$RUNNER_TEMP/tag.txt"
          cat "$RUNNER_TEMP/tag.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Tag $TAG"
            echo
            sed -n -e 's/^kanal=/- Kanal: /p' -e 's/^schluessel=/- Signiert mit dem Release-Schlüssel /p' \
              -e 's/^serie=/- Anker system\/vertrauen, Serie /p' "$RUNNER_TEMP/tag.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  pruefen:
    name: Prüfung
    uses: ./.github/workflows/pruefen.yml
    permissions:
      contents: read

  bauen:
    name: Image bauen
    needs: tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      # Herkunftsbestätigung (attest-build-provenance): OIDC-Token und Ablage der Bestätigung
      id-token: write
      attestations: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            curl ca-certificates gpgv xz-utils e2fsprogs fdisk util-linux mount git openssh-client zerofree psmisc

      - name: Platz auf dem Runner
        run: df -h / "$RUNNER_TEMP"

      - name: Image bauen
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          KANAL: ${{ needs.tag.outputs.kanal }}
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # sudo setzt die Umgebung zurück: ohne GITHUB_ACTIONS gibt bauen.sh keine ::warning::/::error:: aus.
          # bauen.sh prüft die Signatur selbst noch einmal und bricht ab, wenn Kanal oder Version nicht zum Tag passen.
          sudo --preserve-env=GITHUB_ACTIONS image/bauen.sh --ref "refs/tags/$TAG" --version "$VERSION" \
            --kanal "$KANAL" --origin "$ORIGIN" --arbeit "$RUNNER_TEMP/image" --ausgabe "$RUNNER_TEMP/ausgabe"

      - name: Ergebnis prüfen
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        working-directory: ${{ runner.temp }}/ausgabe
        run: |
          datei="zenos-$VERSION-pi5-arm64.img.xz"
          sha256sum --check SHA256SUMS
          grep -q "  zenos-$VERSION-pi5-arm64.pakete.txt\$" SHA256SUMS || { echo "::error::Paketliste fehlt"; exit 1; }
          groesse=$(stat -c %s "$datei")
          if (( groesse >= 2147483648 )); then
            echo "::error::$datei ist $(( groesse / 1048576 )) MiB gross, GitHub nimmt Release-Dateien nur unter 2 GiB an"
            exit 1
          fi
          {
            echo "### zenOS $VERSION"
            echo
            echo "- \`$datei\`: $(( groesse / 1048576 )) MiB"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
            sed -n -e 's/^ubuntu_datei=/- Grundlage: /p' -e 's/^kanal=/- Kanal im Image: /p' \
              -e 's/^signatur=/- Tag signiert mit /p' "$RUNNER_TEMP/image/basis.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Manifest für den Raspberry Pi Imager
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          TAG: ${{ github.ref_name }}
          DOWNLOAD: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          # Der Imager 2.x wendet Benutzer, SSH und WLAN bei eigenen Images nur über ein Manifest mit
          # init_format «cloudinit» an (docs/image-und-releases.md).
          basis="$RUNNER_TEMP/image/basis.txt"
          datei="zenos-$VERSION-pi5-arm64.img.xz"
          groesse=$(sed -n 's/^image_groesse=//p' "$basis")
          sha=$(sed -n 's/^image_sha256=//p' "$basis")
          [[ "$groesse" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::basis.txt ohne Image-Werte"; exit 1; }
          mkdir -p "$RUNNER_TEMP/hinweise"
          jq -n --arg name "zenOS $VERSION" --arg beschreibung "zenOS $VERSION, basiert auf Ubuntu 26.04 LTS" \
            --arg url "$DOWNLOAD/$TAG/$datei" --argjson groesse "$groesse" --arg sha "$sha" \
            --argjson xz_groesse "$(stat -c %s "$RUNNER_TEMP/ausgabe/$datei")" \
            --arg xz_sha "$(sha256sum "$RUNNER_TEMP/ausgabe/$datei" | cut -d ' ' -f 1)" \
            --arg datum "$(date -u +%Y-%m-%d)" '{
              imager: { devices: [ {
                name: "Raspberry Pi 5", tags: ["pi5-64bit"],
                icon: "https://downloads.raspberrypi.com/imager/icons/RPi_5.png",
                description: "Raspberry Pi 5, 500 / 500+, and Compute Module 5",
                matching_type: "exclusive", default: true, capabilities: [] } ] },
              os_list: [ {
                name: $name, description: $beschreibung, icon: "", url: $url,
                extract_size: $groesse, extract_sha256: $sha,
                image_download_size: $xz_groesse, image_download_sha256: $xz_sha,
                release_date: $datum, init_format: "cloudinit", devices: ["pi5-64bit"], capabilities: [] } ]
            }' > "$RUNNER_TEMP/hinweise/zenos-$VERSION.rpi-imager-manifest"
          jq . "$RUNNER_TEMP/hinweise/zenos-$VERSION.rpi-imager-manifest"
          # Das Manifest entscheidet, was der Imager lädt und schreibt (url und Prüfsummen): Es kommt mit in SHA256SUMS
          # und damit in die Herkunftsbestätigung (nächster Schritt). Name ohne Ordner, wie auf der Release-Seite.
          (cd "$RUNNER_TEMP/hinweise" && sha256sum -- "zenos-$VERSION.rpi-imager-manifest") >> "$RUNNER_TEMP/ausgabe/SHA256SUMS"

      - name: Herkunft bestätigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/ausgabe/SHA256SUMS

      - name: Versionshinweise
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          KANAL: ${{ needs.tag.outputs.kanal }}
          SCHLUESSEL: ${{ needs.tag.outputs.schluessel }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ubuntu_datei=$(sed -n 's/^ubuntu_datei=//p' "$RUNNER_TEMP/image/basis.txt")
          ubuntu_sha=$(sed -n 's/^ubuntu_sha256=//p' "$RUNNER_TEMP/image/basis.txt")
          mkdir -p "$RUNNER_TEMP/hinweise"
          cat > "$RUNNER_TEMP/hinweise/versionshinweise.md" <<EOF
          **zenOS $VERSION für den Raspberry Pi 5 (arm64) · basiert auf Ubuntu 26.04 LTS**

          - **Prüfen:** \`sha256sum -c --ignore-missing SHA256SUMS\` (die Liste nennt Image, Paketliste und Manifest) und die Herkunft mit \`gh attestation verify zenos-$VERSION-pi5-arm64.img.xz --repo $REPO\`, ebenso für \`zenos-$VERSION.rpi-imager-manifest\`. Über das Manifest lädt der Imager das Image selbst und prüft es gegen die Prüfsummen darin.
          - **Schreiben:** mit dem Raspberry Pi Imager ab 2.0.11 über die Manifest-Datei \`zenos-$VERSION.rpi-imager-manifest\` (Doppelklick oder «App Options › Content Repository › Edit › Use custom file»). Nur so wirken die Einstellungen für Benutzer, SSH und WLAN. «sudo ohne Passwort» dort aus lassen: Damit, und mit einem Imager bis 2.0.10, schreibt cloud-init eine sudo-Regel ohne Passwort (zen doctor warnt). balenaEtcher geht auch, dann ohne Einstellungen. Ziel: SD-Karte, USB-Stick oder NVMe.
          - **Erste Anmeldung:** Mit Einstellungen aus dem Imager gilt dein eigener Benutzer. Ohne Einstellungen heisst der Benutzer \`user\` mit Passwort \`user\`, das zuerst geändert werden muss: mit \`Ctrl + Alt + F2\` zur Textkonsole, dort anmelden, neues Passwort setzen, \`exit\`, mit \`Ctrl + Alt + F7\` zurück zum Login von zenOS. Für \`user\` fragt sudo immer nach dem Passwort, SSH nimmt nur Schlüssel an.
          - **Argon ONE UP (Compute Module 5):** USB ist eingestellt. Für eine NVMe-SSD muss im EEPROM \`PCIE_PROBE=1\` stehen.
          - **Signatur:** Der Tag \`$TAG\` ist mit dem Release-Schlüssel \`$SCHLUESSEL\` signiert (öffentlich in \`system/vertrauen/release\`). Prüfen im Repo: \`image/tag-pruefen.sh $TAG\` (Name, Kopf und Signatur des Tags gegen die feste Wurzel von zenOS; ein blosses \`git verify-tag\` prüft den Namen nicht).
          - **Updates:** zenOS folgt dem Kanal \`$KANAL\` und installiert nur Tags, die mit diesem Schlüssel signiert sind, zum Zeitpunkt aus Einstellungen › System › Updates (Standard: wenn das Gerät gesperrt ist). Das Grundsystem bekommt Sicherheitsupdates direkt von Ubuntu (main). Für Pakete aus universe (etwa labwc, greetd, kitty) gibt es sie verlässlich nur mit Ubuntu Pro.
          - **Nicht enthalten:** Chrome, VS Code und 1Password. Die Einrichtung beim ersten Start installiert sie auf Wunsch aus den offiziellen Quellen der Hersteller.
          - **Quellcode:** \`zenos-$VERSION-quellen-teil*.tar\` und \`zenos-$VERSION-quickshell-*.tar\` auf dieser Seite, Übersicht in \`zenos-$VERSION-QUELLEN.txt\`, Paketliste in \`zenos-$VERSION-pi5-arm64.pakete.txt\`.
          - **Grundlage:** \`$ubuntu_datei\` (SHA-256 \`$ubuntu_sha\`), Signatur von SHA256SUMS mit dem Ubuntu-CD-Schlüssel geprüft.
          - zenOS ist ein persönliches Projekt, ohne Support.

          ---

          **zenOS $VERSION for Raspberry Pi 5 (arm64) · based on Ubuntu 26.04 LTS**

          - **Verify:** \`sha256sum -c --ignore-missing SHA256SUMS\` (it lists image, package list and manifest) and the provenance with \`gh attestation verify zenos-$VERSION-pi5-arm64.img.xz --repo $REPO\`, likewise for \`zenos-$VERSION.rpi-imager-manifest\`. Through the manifest, the Imager downloads the image itself and checks it against the checksums inside.
          - **Write:** with Raspberry Pi Imager 2.0.11 or later using the manifest file \`zenos-$VERSION.rpi-imager-manifest\` (double-click, or App Options › Content Repository › Edit › Use custom file); only then are user, SSH and Wi-Fi settings applied. Leave passwordless sudo off: with it, or with Imager 2.0.10 and older, cloud-init adds a sudo rule without password (zen doctor warns). balenaEtcher works too, without settings.
          - **First login without Imager settings:** user \`user\`, password \`user\`, which must be changed first on the text console (\`Ctrl + Alt + F2\`, then back with \`Ctrl + Alt + F7\`). For \`user\`, sudo always asks for the password, SSH accepts keys only.
          - **Signature:** the tag \`$TAG\` is signed with the release key \`$SCHLUESSEL\` (public in \`system/vertrauen/release\`). Check it in the repo with \`image/tag-pruefen.sh $TAG\`.
          - **Updates:** zenOS follows the channel \`$KANAL\` and installs only tags signed with this key. Security updates for the base system come straight from Ubuntu (main); universe packages are only reliably covered with Ubuntu Pro. Documentation is in German.
          - **Source code:** the \`quellen-teil*.tar\` and \`quickshell-*.tar\` files on this page.
          - Personal project, no support.

          Ubuntu and Canonical are registered trademarks of Canonical Ltd. Linux® is the registered trademark of Linus Torvalds in the U.S. and other countries. Raspberry Pi is a trademark of Raspberry Pi Ltd. zenOS is not affiliated with or endorsed by Canonical or Raspberry Pi Ltd.
          EOF

      - name: Paketliste für den Quellcode ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-pakete
          path: ${{ runner.temp }}/ausgabe/zenos-${{ needs.tag.outputs.version }}-pi5-arm64.pakete.txt
          if-no-files-found: error
          retention-days: ${{ needs.tag.outputs.release == 'true' && 3 || 14 }}

      - name: Image als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-pi5-arm64
          path: |
            ${{ runner.temp }}/ausgabe/
            ${{ runner.temp }}/hinweise/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.tag.outputs.release == 'true' && 3 || 14 }}

      - name: Install-Log ablegen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-log
          path: ${{ runner.temp }}/image/install.log
          if-no-files-found: ignore
          retention-days: 14

  quellen:
    name: Quellcode
    needs: [tag, bauen]
    # Eigener Runner, weil der Image-Job seinen Platz braucht. Im Container ubuntu:26.04 wie scripts/pruefen.sh
    # (pruefen.yml, gleicher Digest): apt und der Schlüsselbund des Ubuntu-Archivs passen dann sicher zu resolute.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    env:
      DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: read
    steps:
      - name: Werkzeuge
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            ca-certificates curl jq git tar ubuntu-keyring

      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paketliste holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-pakete
          path: pakete

      - name: Quellen holen und packen
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          df -h "$RUNNER_TEMP"
          image/quellen.sh "pakete/zenos-$VERSION-pi5-arm64.pakete.txt" "$RUNNER_TEMP/quellen" --version "$VERSION"
          (cd "$RUNNER_TEMP/quellen" && sha256sum -- * > SHA256SUMS-quellen)
          ls -l "$RUNNER_TEMP/quellen"

      - name: Quellen als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-quellen
          path: ${{ runner.temp }}/quellen/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.tag.outputs.release == 'true' && 3 || 14 }}

  # Nur vX.Y.Z, und nur wenn alles davor grün ist: Signatur, Prüfung (pruefen.yml für diesen Stand), Bau und Quellen.
  # Ohne Statusfunktion im if gilt success() für alle needs.
  veroeffentlichen:
    name: Release
    needs: [tag, pruefen, bauen, quellen]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Artefakt holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-pi5-arm64
          path: artefakt

      - name: Quellen holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenos-${{ needs.tag.outputs.version }}-quellen
          path: quellen

      - name: Prüfen
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        working-directory: artefakt/ausgabe
        run: |
          # SHA256SUMS nennt auch das Manifest, das im Artefakt unter hinweise/ liegt
          grep -v '\.rpi-imager-manifest$' SHA256SUMS | sha256sum --check
          (cd ../hinweise && grep '  zenos-.*\.rpi-imager-manifest$' ../ausgabe/SHA256SUMS | sha256sum --check)
          (cd ../../quellen && sha256sum --check SHA256SUMS-quellen)
          ls ../../quellen/zenos-"$VERSION"-quellen-teil*.tar ../../quellen/zenos-"$VERSION"-QUELLEN.txt >/dev/null
          for teil in ../../quellen/*.tar; do
            if (( $(stat -c %s "$teil") >= 2147483648 )); then echo "::error::$teil ist 2 GiB oder grösser"; exit 1; fi
          done
          groesse=$(stat -c %s "zenos-$VERSION-pi5-arm64.img.xz")
          if (( groesse >= 2147483648 )); then
            echo "::error::Release-Datei ist $(( groesse / 1048576 )) MiB gross (Grenze 2 GiB)"
            exit 1
          fi

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          dateien=("artefakt/ausgabe/zenos-$VERSION-pi5-arm64.img.xz" artefakt/ausgabe/SHA256SUMS
            "artefakt/ausgabe/zenos-$VERSION-pi5-arm64.pakete.txt" "artefakt/hinweise/zenos-$VERSION.rpi-imager-manifest"
            quellen/*.tar "quellen/zenos-$VERSION-QUELLEN.txt" quellen/SHA256SUMS-quellen)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, Dateien werden ersetzt."
            gh release upload "$TAG" "${dateien[@]}" --clobber
            exit 0
          fi
          optionen=(--verify-tag --title "zenOS $VERSION" --notes-file artefakt/hinweise/versionshinweise.md)
          if [[ "$TAG" == *-* ]]; then optionen+=(--prerelease); fi
          gh release create "$TAG" "${dateien[@]}" "${optionen[@]}"
