# Image-Bau für den Raspberry Pi 5, nur bei Tags v*.
# Tags mit «-rc» (z. B. v0.1.0-rc1): Image bauen und als Workflow-Artefakt ablegen, kein Release.
# Andere v*-Tags: dazu ein GitHub-Release mit zenos-<version>-pi5-arm64.img.xz und SHA256SUMS.
# Ablauf und Grenzen: image/README.md und docs/image-und-releases.md.
name: Image

on:
  push:
    tags:
      - "v*"

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    name: Image bauen
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Tag prüfen
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag «$TAG» hat nicht die Form v<major>.<minor>.<patch>[-<zusatz>]"
            exit 1
          fi
          release=true
          if [[ "$TAG" == *-rc* ]]; then release=false; fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "zenOS ${TAG#v} · Release: $release"

      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            curl ca-certificates gpgv xz-utils e2fsprogs fdisk util-linux mount git zerofree psmisc

      - name: Platz auf dem Runner
        run: df -h / "$RUNNER_TEMP"

      - name: Image bauen
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # sudo setzt die Umgebung zurück: ohne GITHUB_ACTIONS gibt bauen.sh keine ::warning::/::error:: aus
          sudo --preserve-env=GITHUB_ACTIONS image/bauen.sh --ref "refs/tags/$TAG" --version "$VERSION" \
            --origin "$ORIGIN" --arbeit "$RUNNER_TEMP/image" --ausgabe "$RUNNER_TEMP/ausgabe"

      - name: Ergebnis prüfen
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        working-directory: ${{ runner.temp }}/ausgabe
        run: |
          datei="zenos-$VERSION-pi5-arm64.img.xz"
          sha256sum --check SHA256SUMS
          groesse=$(stat -c %s "$datei")
          if (( groesse >= 2147483648 )); then
            echo "::error::$datei ist $(( groesse / 1048576 )) MiB gross, GitHub nimmt Release-Dateien nur unter 2 GiB an"
            exit 1
          fi
          {
            echo "### zenOS $VERSION"
            echo
            echo "- \`$datei\`: $(( groesse / 1048576 )) MiB"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
            sed -n 's/^ubuntu_datei=/- Grundlage: /p' "$RUNNER_TEMP/image/basis.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Versionshinweise
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ubuntu_datei=$(sed -n 's/^ubuntu_datei=//p' "$RUNNER_TEMP/image/basis.txt")
          ubuntu_sha=$(sed -n 's/^ubuntu_sha256=//p' "$RUNNER_TEMP/image/basis.txt")
          mkdir -p "$RUNNER_TEMP/hinweise"
          cat > "$RUNNER_TEMP/hinweise/versionshinweise.md" <<EOF
          zenOS $VERSION für den Raspberry Pi 5 (arm64), basiert auf Ubuntu 26.04 LTS Server.

          - Prüfen: \`sha256sum -c SHA256SUMS\`
          - Schreiben: am besten mit dem Raspberry Pi Imager («Eigenes Image»), dort unter «Einstellungen» Benutzer und Passwort setzen (optional SSH mit deinem öffentlichen Schlüssel). balenaEtcher geht auch, dann ohne Einstellungen. Ziel: SD-Karte, USB-Stick oder NVMe.
          - Erste Anmeldung: Beim ersten Start ein bis zwei Minuten warten, bis cloud-init den Benutzer angelegt hat. Mit Einstellungen aus dem Imager meldest du dich direkt im zenOS-Login an.
          - Ohne Einstellungen heisst der Benutzer \`ubuntu\` mit Passwort \`ubuntu\`, und das Passwort muss zuerst geändert werden. Das geht nicht im zenOS-Login: Mit \`Ctrl + Alt + F2\` zur Textkonsole wechseln, dort mit \`ubuntu\` / \`ubuntu\` anmelden, ein neues Passwort setzen und mit \`exit\` abmelden. Mit \`Ctrl + Alt + F7\` zurück zum zenOS-Login und dort mit dem neuen Passwort anmelden.
          - Chrome, VS Code und 1Password sind nicht enthalten. Die Einrichtung beim ersten Start installiert sie auf Wunsch aus den offiziellen Quellen der Hersteller.
          - Grundlage: \`$ubuntu_datei\` (SHA-256 \`$ubuntu_sha\`), Signatur von SHA256SUMS mit dem Ubuntu-CD-Schlüssel geprüft.
          EOF

      - name: Image als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenos-${{ steps.tag.outputs.version }}-pi5-arm64
          path: |
            ${{ runner.temp }}/ausgabe/
            ${{ runner.temp }}/hinweise/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.tag.outputs.release == 'true' && 3 || 14 }}

      - name: Install-Log ablegen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-log
          path: ${{ runner.temp }}/image/install.log
          if-no-files-found: ignore
          retention-days: 14

  veroeffentlichen:
    name: Release
    needs: bauen
    if: needs.bauen.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Artefakt holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenos-${{ needs.bauen.outputs.version }}-pi5-arm64
          path: artefakt

      - name: Prüfen
        env:
          VERSION: ${{ needs.bauen.outputs.version }}
        working-directory: artefakt/ausgabe
        run: |
          sha256sum --check SHA256SUMS
          groesse=$(stat -c %s "zenos-$VERSION-pi5-arm64.img.xz")
          if (( groesse >= 2147483648 )); then
            echo "::error::Release-Datei ist $(( groesse / 1048576 )) MiB gross (Grenze 2 GiB)"
            exit 1
          fi

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.bauen.outputs.version }}
        run: |
          dateien=("artefakt/ausgabe/zenos-$VERSION-pi5-arm64.img.xz" artefakt/ausgabe/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, Dateien werden ersetzt."
            gh release upload "$TAG" "${dateien[@]}" --clobber
            exit 0
          fi
          optionen=(--verify-tag --title "zenOS $VERSION" --notes-file artefakt/hinweise/versionshinweise.md)
          if [[ "$TAG" == *-* ]]; then optionen+=(--prerelease); fi
          gh release create "$TAG" "${dateien[@]}" "${optionen[@]}"
