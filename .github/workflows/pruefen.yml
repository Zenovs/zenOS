# Prüft jeden Push und jeden Pull Request auf dev und main und jeden Tag v* mit scripts/pruefen.sh: gitleaks über
# den ganzen Verlauf und den Arbeitsstand, shellcheck, Python-Syntax, JSON-Schemas, Hex- und sh-c-Regel, Dateinamen,
# Einheitentests unter test/einheiten (python3, node, fish) und qmllint (ohne Quickshell-Typen: rot nur bei
# Syntaxfehlern). Der Teil mit der laufenden Oberfläche wird ohne labwc und Quickshell übersprungen.
# image.yml ruft diesen Workflow für jeden Tag v* zusätzlich selbst auf (workflow_call, Job «Prüfung»): Ein Release
# gibt es nur, wenn diese Prüfung für genau diesen Stand im selben Lauf grün ist.
# Läuft in Ubuntu 26.04 wie der Pi, auf einem arm64-Runner. Einzige fremde Action ist actions/checkout, auf
# einen Commit festgelegt. Keine Geheimnisse, nur Leserechte, nichts wird hochgeladen.

name: pruefen

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

# Je Workflow und Ref eine Gruppe: Aufgerufen aus image.yml ist github.workflow «Image». So bricht der Lauf für den
# Tag den aus image.yml nicht ab (und umgekehrt).
concurrency:
  group: pruefen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: scripts/pruefen.sh
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      # ubuntu:26.04, festgelegt auf den Stand vom 12.09.2026 (Index-Digest für alle Architekturen).
      # Neuer Stand: docker buildx imagetools inspect ubuntu:26.04 → «Digest:» hier eintragen.
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      # git vor dem Auschecken, sonst lädt actions/checkout nur ein Archiv ohne Verlauf.
      # nodejs, fish, unattended-upgrades, lsb-release, openssh-client und python3-yaml nur für die Einheitentests
      # (ohne sie überspringt pruefen.sh diese Tests; unattended-upgrades und lsb-release braucht
      # sicherheitsquelle.test.py, openssh-client mit ssh-keygen und ssh-agent release-signieren.test.py und
      # image-signatur.test.py, python3-yaml dort die Prüfschritte von image.yml).
      - name: Werkzeuge installieren
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            ca-certificates git shellcheck gitleaks python3 python3-jsonschema python3-yaml qt6-declarative-dev-tools \
            nodejs fish unattended-upgrades lsb-release openssh-client

      - name: Auschecken (ganzer Verlauf für gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Der Arbeitsordner gehört im Container einem anderen Benutzer als root
      - name: Arbeitsordner für git freigeben
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: scripts/pruefen.sh
        run: ./scripts/pruefen.sh
