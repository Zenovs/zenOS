# zenOS: kein Wechsel der Ubuntu-Hauptversion (scripts/module/71-basis.sh)
#
# Ein Basiswechsel (etwa 26.04 auf 28.04) ist eine neue zenOS-Hauptversion mit neuem Image, kein Update
# (docs/image-und-releases.md, "Basiswechsel"). Mit Prompt=never lehnt do-release-upgrade ab, und weder
# check-new-release noch die Begruessung (91-release-upgrade) fragen changelogs.ubuntu.com nach einer neuen Version.
# Der Release-Upgrader liest zuerst /etc/update-manager/release-upgrades, danach die *.cfg hier in Namensreihenfolge;
# der letzte Wert zaehlt. Die Conffile des Pakets bleibt so unberuehrt (apt und unattended-upgrades aktualisieren es
# weiter ohne Rueckfrage). Nur ASCII: Der Release-Upgrader liest die Datei mit der Kodierung der Umgebung.
[DEFAULT]
Prompt=never
