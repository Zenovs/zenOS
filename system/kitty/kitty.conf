# zenOS · kitty
# ~/.config/kitty/kitty.conf verweist hierher (scripts/module/60-terminal.sh).
#
# Farben stehen bewusst nicht hier: zenos-thema schreibt sie aus shell/theme/tokens.json nach
# dark-theme.auto.conf, light-theme.auto.conf und no-preference-theme.auto.conf im selben Ordner.
# kitty nimmt je nach Farbschema des Systems (Portal) die passende Datei und wechselt live mit.
# Fehlen die Dateien, gelten kittys eigene Grundfarben (dunkel), bis zenos-thema sie schreibt.
# Palette: Grün = Akzent des Modus, Rot = fehler, Gelb = warnung, Hellschwarz = gedaempft.
#
# kitty kennt nur ganze Kommentarzeilen: keine Kommentare hinter einem Wert.

# --- Schrift ---------------------------------------------------------------
# 10,5 pt = 14 px bei 96 dpi wie in Entwurf 2; etwas mehr Zeilenhöhe für ruhige Blöcke
font_family      family="Geist Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
modify_font      cell_height 125%
disable_ligatures cursor
# Rahmenlinien (Karten, Trennlinie zwischen Befehlen) etwas feiner: 0,75 pt statt 1 pt
box_drawing_scale 0.001, 0.75, 1.5, 2

# --- Shell -----------------------------------------------------------------
# fish direkt, ohne die Login-Shell zu ändern. Shell-Integration für Befehlsblöcke,
# Super+↑↓ und das schlaue Ctrl+C; die Form des Cursors bestimmt diese Datei, nicht die Integration.
shell             fish
shell_integration enabled no-cursor

# --- Ruhe: nichts blinkt, nichts piept -------------------------------------
cursor_shape             block
cursor_shape_unfocused   hollow
cursor_blink_interval    0
cursor_trail             0
enable_audio_bell        no
visual_bell_duration     0
window_alert_on_bell     no
bell_on_tab              none
command_on_bell          none
tab_activity_symbol      none

# --- Fenster ---------------------------------------------------------------
# Titelzeile und Rand zeichnet labwc. Innenabstand wie in Entwurf 2 (14 px oben, 28 px seitlich).
window_padding_width     10.5 21 6 21
placement_strategy       top-left
hide_window_decorations  no
confirm_os_window_close  -1
enabled_layouts          splits,stack
scrollback_lines         10000

# --- Tabs ------------------------------------------------------------------
# Oben, erst ab zwei Tabs. Der aktive Tab trägt einen Punkt im Akzent (Palette Grün).
tab_bar_edge              top
tab_bar_style             separator
tab_separator             ""
tab_bar_min_tabs          2
tab_bar_align             left
tab_bar_margin_width      6
tab_bar_margin_height     6 6
tab_title_max_length      28
tab_title_template        "   {title}   "
active_tab_title_template " {fmt.fg.color2}●{fmt.fg.tab} {title}   "
active_tab_font_style     normal
inactive_tab_font_style   normal

# --- Datenschutz -----------------------------------------------------------
# Keine Abfrage nach Updates (kommen über apt), keine Fernsteuerung von aussen.
update_check_interval 0
allow_remote_control  no

# --- Tastenkürzel ----------------------------------------------------------
# Ctrl+C kopiert, wenn etwas markiert ist, sonst bricht es ab. Ctrl+V fügt ein.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+t new_tab_with_cwd
map super+w close_tab
map super+d launch --location=vsplit --cwd=current
map super+shift+d launch --location=hsplit --cwd=current
map super+up scroll_to_prompt -1
map super+down scroll_to_prompt 1
map super+k clear_terminal to_cursor active

map super+plus change_font_size all +1.0
map super+equal change_font_size all +1.0
map super+shift+equal change_font_size all +1.0
map super+kp_add change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+kp_subtract change_font_size all -1.0
map super+0 change_font_size all 0
map super+kp_0 change_font_size all 0
