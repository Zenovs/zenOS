# zenOS: Im Startmenü heisst es zenOS, Ordner und EFI-Eintrag bleiben bei Ubuntu (scripts/module/72-kennung.sh,
# docs/module/kennung.md).
#
# Ubuntu leitet GRUB_DISTRIBUTOR aus NAME in /etc/os-release ab (/etc/default/grub). grub-install macht daraus den
# Ordner EFI/<name> auf der EFI-Partition und den EFI-Starteintrag, grub-mkconfig die Namen im Startmenü. Der
# signierte GRUB von Ubuntu sucht seine Konfiguration fest unter /EFI/ubuntu, und am Bootloader ändert zenOS nichts
# ohne Rückfrage: Für grub-install (auch aus den Paketen grub und shim) bleibt es Ubuntu. Nur grub-mkconfig
# (update-grub) setzt vor dem Einlesen dieser Datei «self=grub-mkconfig» und bekommt zenOS. Die Datei wird nach
# /etc/default/grub gelesen.
if [ "${self:-}" = grub-mkconfig ]; then
  GRUB_DISTRIBUTOR=zenOS
else
  GRUB_DISTRIBUTOR=Ubuntu
fi
