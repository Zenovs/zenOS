# zenOS: GRUB behält den Namen von Ubuntu (scripts/module/72-kennung.sh, docs/module/kennung.md).
#
# Ubuntu leitet GRUB_DISTRIBUTOR aus NAME in /etc/os-release ab (/etc/default/grub). Daraus entstehen der Ordner
# EFI/<name> auf der EFI-Partition, der EFI-Starteintrag und die Namen im Startmenü. Mit der Kennung zenOS
# (NAME="zenOS") legte das nächste grub-install, etwa bei einem Update von grub oder shim, still einen neuen Ordner
# EFI/zenos und einen neuen EFI-Eintrag an. Am Bootloader ändert zenOS nichts ohne Rückfrage: Mit dieser Datei bleibt
# alles bei EFI/ubuntu. Sie wird nach /etc/default/grub gelesen und gilt so für grub-mkconfig und grub-install.
GRUB_DISTRIBUTOR=Ubuntu
