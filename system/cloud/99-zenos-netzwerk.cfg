# zenOS: cloud-init schreibt keine Netzwerk-Konfiguration mehr, NetworkManager verwaltet das Netz. Sonst entstünde
# bei einer neuen cloud-init-Instanz wieder 50-cloud-init.yaml mit «renderer: networkd». Abgelegt von
# «zen netzwerk umstellen», entfernt von «zen netzwerk zurueck». Nie im Image vor dem ersten Start: Dann griffe
# das WLAN aus dem Raspberry Pi Imager nicht.
network: {config: disabled}
