# xdg-desktop-portal-wlr für zenOS (installiert nach /etc/xdg/xdg-desktop-portal-wlr/config
# von scripts/module/55-zustaende.sh).
#
# Bildschirmfreigabe: vor und nach jeder Freigabe meldet zenos-freigabe das der Oberfläche.
# Dann startet der Zustand «Sitzung» (Auslöser bildschirmfreigabe), die Arbeitsfläche bekommt den
# Rahmen in «sitzung», und Mitteilungsinhalte bleiben verborgen (Leitplanke).
# Den Bildschirm wählst du mit einem Klick (slurp); Esc bricht die Freigabe ab.

[screencast]
exec_before=/opt/zenos/scripts/bin/zenos-freigabe start
exec_after=/opt/zenos/scripts/bin/zenos-freigabe ende
chooser_type=simple
chooser_cmd=/opt/zenos/scripts/bin/zenos-freigabe waehlen
max_fps=30
