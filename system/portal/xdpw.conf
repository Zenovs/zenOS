# xdg-desktop-portal-wlr für zenOS (installiert nach /etc/xdg/xdg-desktop-portal-wlr/config
# von scripts/module/55-zustaende.sh).
#
# Bildschirmfreigabe: vor und nach jeder Freigabe meldet zenos-freigabe das der Oberfläche.
# Dann startet der Zustand «Sitzung» (Auslöser bildschirmfreigabe), die Arbeitsfläche bekommt den
# Rahmen in «sitzung», und Mitteilungsinhalte bleiben verborgen (Leitplanke).
# Den Bildschirm wählst du mit einem Klick (slurp); Esc bricht die Freigabe ab.
# Das Portal wartet nicht auf exec_before, nur auf chooser_cmd: Schon die Wahl benachrichtigt die
# Oberfläche, damit das erste geteilte Bild keine Inhalte zeigt.
# exec_after (zenos-freigabe ende) löscht den Marker erst nach einem Nachlauf von 3 s und nur, wenn
# seither keine neue Freigabe begann: Chrome schliesst beim Klick auf «Teilen» die Sitzung der
# Vorschau und öffnet sofort eine zweite ohne Wahl; exec_after und exec_before kommen dann
# Millisekunden nacheinander, ohne dass xdpw wartet (siehe scripts/bin/zenos-freigabe).
# Eine Datei ~/.config/xdg-desktop-portal-wlr/{labwc,wlroots,config} oder hier …/{labwc,wlroots}
# ersetzt diese ganz (zen doctor meldet das).

[screencast]
exec_before=/opt/zenos/scripts/bin/zenos-freigabe start
exec_after=/opt/zenos/scripts/bin/zenos-freigabe ende
chooser_type=simple
chooser_cmd=/opt/zenos/scripts/bin/zenos-freigabe waehlen
max_fps=30
