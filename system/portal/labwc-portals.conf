# zenOS: Portale für die labwc-Sitzung (XDG_CURRENT_DESKTOP=labwc:wlroots).
# Installiert nach /etc/xdg/xdg-desktop-portal/labwc-portals.conf, ersetzt die Vorgabe des labwc-Pakets.
# gtk liefert Settings (color-scheme für Chrome, Qt, Electron), Dateiauswahl und den Rest;
# Bildschirmfreigabe und Bildschirmfoto laufen über wlr. Inhibit wie im labwc-Paket aus
# (die gtk-Umsetzung braucht gnome-session).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
