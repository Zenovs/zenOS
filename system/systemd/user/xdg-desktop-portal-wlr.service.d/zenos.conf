# zenOS: Ergänzung zu xdg-desktop-portal-wlr.service (installiert von scripts/module/55-zustaende.sh nach
# /etc/systemd/user/xdg-desktop-portal-wlr.service.d/zenos.conf).
# Mit dem Portal endet jede Bildschirmfreigabe. Endet es ohne exec_after (Absturz, SIGKILL, Neustart),
# bliebe der Marker stehen: Rahmen und «Inhalte verborgen» bis zur nächsten Anmeldung. Nach jedem Ende
# setzt zenos-freigabe die Freigabe deshalb zurück; ohne laufende Freigabe ändert das nichts.
# Nach «systemctl --user kill» (SIGKILL an die ganze cgroup) tötet systemd 259 auch ExecStopPost sofort.
# Deshalb setzt auch jeder Start des Portals zurück, bevor es Streams geben kann (Restart=on-failure,
# D-Bus-Aktivierung).
[Service]
ExecStartPre=-/opt/zenos/scripts/bin/zenos-freigabe zuruecksetzen
ExecStopPost=-/opt/zenos/scripts/bin/zenos-freigabe zuruecksetzen
