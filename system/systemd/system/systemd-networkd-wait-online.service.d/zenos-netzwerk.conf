# zenOS: Nach «zen netzwerk umstellen» verwaltet NetworkManager das Netz, systemd-networkd hat nichts mehr zu tun.
# systemd-networkd-wait-online wartete dann bis zu 2 Minuten auf Verbindungen, die es nicht gibt, und endete als
# «failed». Solange umgestellt ist, übernimmt NetworkManager-wait-online diese Aufgabe; nach «zen netzwerk
# zurueck» (die Datei fehlt dann) läuft es wieder wie gewohnt.
[Unit]
ConditionPathExists=!/etc/netplan/90-zenos-netzwerk.yaml
