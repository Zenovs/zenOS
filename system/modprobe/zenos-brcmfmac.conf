# zenOS: WPA3 (SAE) im WLAN-Treiber brcmfmac abschalten (Raspberry Pi 4/5, Compute Module 5). Abgelegt von
# «zen netzwerk umstellen» bzw. im Image. «zen netzwerk zurueck» entfernt sie nur, wenn «umstellen» sie angelegt
# hat; im Image war sie schon vor dem ersten Start da und bleibt (sie hilft auch systemd-networkd mit
# wpa_supplicant bei Mischnetzen). Von Hand: sudo rm /etc/modprobe.d/zenos-brcmfmac.conf, dann neu starten.
# Wirkt nach dem Neustart.
# Grund: Der Chip CYW43455 bricht WPA3 mit Ubuntus Firmware 7.45.265 ab (status_code=16), und NetworkManager
# versucht bei WPA2/WPA3-Mischnetzen immer WPA3, sobald der Treiber es meldet. Ohne SAE verbinden Mischnetze
# über WPA2; reine WPA3-Netze gehen nicht (das gehen sie mit diesem Chip ohnehin nicht).
# Bits: 13 FWSUP (0x2000), 19 SAE (0x80000), 25 SAE_EXT (0x2000000). Raspberry Pi OS setzt 0x282000 und
# vergisst Bit 25 (raspberrypi/linux #7634).
options brcmfmac feature_disable=0x2082000
